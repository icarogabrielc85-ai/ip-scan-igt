name: Build & Package IP Scan IGT (Linux .deb & Windows .msi / .exe)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe, Setup & .msi)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Standalone Executable (.exe)
        run: |
          pyinstaller --clean ipscan_windows.spec

      - name: Build Windows Inno Setup Installer (.exe)
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" ipscan_windows.iss

      - name: Build Windows MSI Package (.msi)
        run: |
          $candle = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) {
            choco install wixtoolset -y
            $candle = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($candle) {
            $wixBin = $candle.DirectoryName
            & "$wixBin\candle.exe" -arch x64 ipscan_windows.wxs -out dist\ipscan_windows.wixobj
            & "$wixBin\light.exe" -ext WixUIExtension dist\ipscan_windows.wixobj -out dist\IPScanIGT.msi
          }

      - name: Stage Windows Output Files
        run: |
          if (Test-Path "Output\IPScanIGT-Setup-*.exe") {
            Copy-Item "Output\IPScanIGT-Setup-*.exe" -Destination "dist\"
          }
          Get-ChildItem -Path dist\

      - name: Upload Windows Artifacts (.exe and .msi)
        uses: actions/upload-artifact@v4
        with:
          name: IPScanIGT-Windows-x64
          path: |
            dist/IPScanIGT.exe
            dist/IPScanIGT-Setup-*.exe
            dist/*.msi
          if-no-files-found: warn

  build-linux:
    name: Build Linux Binary & Debian Package (.deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 dpkg-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Standalone Executable
        run: |
          pyinstaller --clean ipscan_linux.spec

      - name: Build Debian Package (.deb)
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Upload Linux Artifacts (Binary & .deb)
        uses: actions/upload-artifact@v4
        with:
          name: IPScanIGT-Linux-x64
          path: |
            dist/IPScanIGT
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publicar Release Oficial (.deb, .msi, .exe)
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -type f \( -name "*.deb" -o -name "*.msi" -o -name "*.exe" -o -name "IPScanIGT" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.11.2
          name: "IP Scan IGT v2.11.2 — Pacotes .deb (Linux), .msi e .exe (Windows)"
          body: |
            ## 📦 Downloads Oficiais do IP Scan IGT (v2.11.2)

            Selecione o pacote compatível com seu sistema operacional:

            ### 🐧 Linux (Ubuntu, Debian, Pop!_OS, Linux Mint, Kali):
            - **Pacote Debian (.deb):** `ipscan-igt_2.11.2_amd64.deb`  
              *(Instale dando duplo-clique ou pelo terminal: `sudo apt install ./ipscan-igt_2.11.2_amd64.deb`)*
            - **Binário Portátil:** `IPScanIGT`

            ### 🪟 Windows 10 e Windows 11:
            - **Instalador Assistente Recomendado (.exe):** `IPScanIGT-Setup-2.11.2.exe`  
              *(Instala o programa completo com todas as DLLs nativas em `Arquivos de Programas` e cria atalho na Área de Trabalho)*
            - **Instalador MSI (.msi):** `IPScanIGT.msi`  
              *(Instalação padrão corporativa do Windows)*
            - **Executável Portátil (.exe):** `IPScanIGT.exe`  
              *(Executa direto com duplo-clique sem precisar instalar, com VC++ Runtime e UCRT embutidos)*

            ### 🚀 Novidades da Versão 2.11.2:
            - **🔄 Atualização Direta no Gerenciador de Pacotes:** Versão v2.11.2 permitindo ao APT / KDE Discover / QApt detectar a atualização do `.deb` sem conflito de versão já instalada.
            - **🛡️ Permissões L2 Automáticas nos Instaladores:** O pacote Debian (`.deb`) e o script `instalar_linux.sh` agora configuram de forma automática e permanente `setcap cap_net_raw,cap_net_admin+eip` no binário instalado e incluem dependência `libcap2-bin`, sem exigir intervenção manual do usuário.
            - **🪟 Instalador Windows (.exe) com Privilégios e Firewall Embutidos:** O instalador Inno Setup agora solicita privilégios de administrador nativamente e aplica regras de firewall para tráfego local e broadcast/multicast.
            - **🔐 Assistente Interativo de Permissões na Interface (LLDPSwitchDialog):** Diálogo inteligente oferecendo fallback para SNMP Bridge-MIB (sem requerer root), elevação gráfica em 1-clique via Polkit (`pkexec`) e comando copiável para terminal.
            - **🔒 Auditoria Completa de Segurança:** Varredura minuciosa de todo o repositório e histórico Git garantindo ausência de credenciais, além de reforço estrito no `.gitignore`.
            - **🔌 Identificador Visual de Porta de Switch (LLDP / CDP / SNMP):** Renderização vetorial de switch 1U em rack 19" (8, 16, 24 ou 48 portas RJ45 com pinos banhados a ouro e slots SFP+), destaque de porta local e animação de patch cord.
          files: |
            release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
