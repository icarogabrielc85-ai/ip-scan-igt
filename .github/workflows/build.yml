name: Build IP Scan IGT (Linux & Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          pyinstaller --clean ipscan_windows.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPScanIGT-Windows-x64
          path: dist/IPScanIGT.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux Executable (Binary)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Executable
        run: |
          pyinstaller --clean ipscan_linux.spec

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPScanIGT-Linux-x64
          path: dist/IPScanIGT
          if-no-files-found: error
